name: Task
description: A piece of technical work. Planning lives in Plane, so link it.
labels: [task]
body:
  - type: input
    id: plane
    attributes:
      label: Plane work item
      placeholder: LL-42
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What needs doing, and what done looks like.
    validations:
      required: true
