name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: plane
    attributes:
      label: Plane work item
      placeholder: LL-42
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
